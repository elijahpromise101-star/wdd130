<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | White Water Rafting</title>
    <meta name="description"
      content="Contact White Water Rafting to ask questions, view our location map, or learn more about our team.">
    <meta name="author" content="Elijah Promise">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/logo.png" alt="White Water Rafting Logo" class="logo"
          style="width: 120px; height: auto; max-height: 80px; object-fit: contain;">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <section class="company-info">
            <h1>White Water Rafting Company</h1>
            <div class="info-details">
                <p><strong>Address:</strong> 123 Main River Street, Kolob, California</p>
                <p><strong>Phone:</strong> +1 999 999 9999</p>
                <p><strong>Email:</strong> info@whitewater.com</p>
            </div>

            <div class="map-and-form">
                <div class="map-container">
                    <iframe
                      src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d11558.123456789!2d-116.2023!3d43.6150!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zNDPCsDM2JzU0LjAiTiAxMTbDwrAxMic4LjMiVw!5e0!3m2!1sen!2sus!4v1234567890"
                      width="400" height="300" loading="lazy" title="White Water Rafting Location">
                    </iframe>
                </div>

                <form action="#" method="post" class="contact-form">
                    <div class="form-item">
                        <label for="fullname">Name</label>
                        <input type="text" id="fullname" name="fullname"
                          placeholder="Your Full Name" required>
                    </div>

                    <div class="form-item">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Your Email Address"
                          required>
                    </div>

                    <fieldset class="purpose-fieldset">
                        <legend>Message Purpose</legend>
                        <div class="radio-option">
                            <input type="radio" id="general" name="purpose" value="general" checked>
                            <label for="general">General Inquiry</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" id="reservation" name="purpose" value="reservation">
                            <label for="reservation">Reservation Question</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" id="website" name="purpose" value="website">
                            <label for="website">Website Suggestion</label>
                        </div>
                    </fieldset>

                    <div class="form-item">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="4" placeholder="Type here..."
                          required></textarea>
                    </div>

                    <div class="form-item checkbox-item">
                        <input type="checkbox" id="subscribe" name="subscribe" value="yes">
                        <label for="subscribe">Please subscribe me to the monthly newsletter</label>
                    </div>

                    <button type="submit" class="submit-btn">Get in Touch!</button>
                </form>
            </div>
        </section>

        <section class="employees">
            <h2>We Are Here to Serve You</h2>
            <div class="employee-grid">
                <figure>
                    <img src="images/employee1.jpg" alt="John Doe, Head River Guide">
                    <figcaption>John Doe - Head River Guide</figcaption>
                </figure>
                <figure>
                    <img src="images/employee2.jpg" alt="Jane Smith, Safety Director">
                    <figcaption>Jane Smith - Safety Director</figcaption>
                </figure>
                <figure>
                    <img src="images/employee3.jpg" alt="Alex Johnson, Operations Manager">
                    <figcaption>Alex Johnson - Operations Manager</figcaption>
                </figure>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 White Water Rafting | Promise Elijah</p>
        <nav class="socialmedia">
            <a href="https://facebook.com"><img src="images/facebook.png" alt="Facebook Icon"
                  style="width:32px; height:32px; object-fit:contain;"></a>
            <a href="https://twitter.com"><img src="images/twitter.jpg" alt="Twitter Icon"
                  style="width:32px; height:32px; object-fit:contain;"></a>
            <a href="https://instagram.com"><img src="images/instagram.png" alt="Instagram Icon"
                  style="width:32px; height:32px; object-fit:contain;"></a>
        </nav>
    </footer>
</body>

</html>
