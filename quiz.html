<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Form Quiz | WDD 130</title>
    <meta name="description" content="HTML Form Quiz practice activity for WDD 130">
    <meta name="author" content="Elijah Promise">
    <link rel="stylesheet" href="styles/styles.css">
</head>

<body>
    <header>
        <h1>HTML Form Quiz</h1>
    </header>
    <main>
        <form>
            <fieldset>
                <legend>Basic Information</legend>

                <label for="q1">1. What does the acronym HTML stand for?</label>
                <input type="text" id="q1" name="q1">

                <label for="q2">2. How do you create an unordered list in HTML?</label>
                <textarea id="q2" name="q2" rows="4"></textarea>
            </fieldset>

            <fieldset>
                <legend>Multiple Choice Questions</legend>

                <label for="q3">3. Which element is used to define an HTML form?</label>
                <select id="q3" name="q3">
                    <option value="" disabled selected>Choose One ...</option>
                    <option value="form">&lt;form&gt;</option>
                    <option value="input">&lt;input&gt;</option>
                    <option value="field">&lt;fieldset&gt;</option>
                </select>

                <label for="q4">4. What is the correct HTML element for the largest heading?</label>
                <input type="number" id="q4" name="q4">
            </fieldset>

            <button type="submit">Submit Quiz</button>
        </form>
    </main>
    <footer>
        <p>&copy; 2026 | Promise Elijah Elijah | WDD 130</p>
    </footer>
</body>

</html>
